<form id="contact-form" action="{{ site.google_form.action }}" method="POST" target="google-form-response">
	<div class="fields">
		<div class="field half">
			<label for="name">Name</label>
			<input type="text" name="entry.{{ site.google_form.entries.name }}" id="name" placeholder="Your name" required />
		</div>
		<div class="field half">
			<label for="email">Email</label>
			<input type="email" name="entry.{{ site.google_form.entries.email }}" id="email" placeholder="you@example.com" required />
		</div>
		<div class="field">
			<label for="project-type">Project type</label>
			<select name="entry.{{ site.google_form.entries.project_type }}" id="project-type" required>
				<option value="Apartments">Apartments</option>
				<option value="Villas">Villas</option>
				<option value="Commercial">Commercial</option>
				<option value="Other">Other</option>
			</select>
		</div>
		<div class="field">
			<label for="message">Detail</label>
			<textarea name="entry.{{ site.google_form.entries.detail }}" id="message" placeholder="Tell us about the site, brief, and timeline." rows="7" required></textarea>
		</div>
	</div>
	<ul class="actions">
		<li><input type="submit" value="Send message" class="button primary" /></li>
	</ul>
</form>
<iframe name="google-form-response" id="google-form-response" class="form-response-frame" title="Form submission" hidden></iframe>
<p id="form-success" class="form-success" hidden>Thank you — your message was sent. We will be in touch soon.</p>
